<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mainoffice — Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden}
        body{font-family:'Space Grotesk',system-ui,sans-serif;background:#383b34}

        .bg-frame{position:fixed;inset:0;z-index:0;border:none;width:100%;height:100%}

        .overlay{
            position:fixed;inset:0;z-index:10;
            display:grid;place-items:center;
            pointer-events:none;
        }

        .card{
            pointer-events:auto;
            width:min(90vw,520px);
            background:rgba(18,22,16,.72);
            border:1px solid rgba(255,255,255,.1);
            border-radius:20px;
            padding:clamp(2rem,5vw,3rem);
            backdrop-filter:blur(24px) saturate(1.2);
            -webkit-backdrop-filter:blur(24px) saturate(1.2);
            box-shadow:
                0 24px 80px rgba(0,0,0,.45),
                0 8px 32px rgba(0,0,0,.3),
                inset 0 1px 0 rgba(255,255,255,.08);
            text-align:center;
            animation:cardIn 1.2s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes cardIn{
            from{opacity:0;transform:translateY(30px) scale(.96)}
            to{opacity:1;transform:none}
        }

        .card-icon{
            width:56px;height:56px;margin:0 auto 1.5rem;
            border-radius:14px;
            background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.08);
            display:grid;place-items:center;
        }
        .card-icon svg{width:26px;height:26px;stroke:rgba(255,255,255,.7)}

        h1{
            font-size:clamp(1.6rem,4vw,2.25rem);
            font-weight:700;letter-spacing:-.03em;line-height:1.15;
            margin-bottom:.75rem;
            color:#fff;
        }

        .desc{
            font-size:clamp(.9rem,2vw,1.05rem);
            color:rgba(255,255,255,.55);
            line-height:1.7;max-width:400px;
            margin:0 auto 1.75rem;
        }

        .progress-wrap{margin-bottom:1.75rem}
        .progress-head{
            display:flex;justify-content:space-between;
            margin-bottom:.6rem;
            font-family:'JetBrains Mono',monospace;
            font-size:.7rem;text-transform:uppercase;
            letter-spacing:.06em;color:rgba(255,255,255,.4);
        }
        .progress-track{
            height:5px;background:rgba(255,255,255,.06);
            border-radius:3px;overflow:hidden;
        }
        .progress-bar{
            height:100%;width:0%;
            background:linear-gradient(90deg,#4ade80,#22d3ee,#818cf8);
            border-radius:3px;
            animation:fillProgress 8s ease-in-out infinite;
        }
        @keyframes fillProgress{
            0%{width:0%;transform-origin:left}
            50%{width:100%;transform-origin:left}
            50.01%{transform-origin:right}
            100%{width:0%;transform-origin:right}
        }

        .badge{
            display:inline-flex;align-items:center;gap:.5rem;
            padding:.45rem .9rem;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
            border-radius:999px;
            font-family:'JetBrains Mono',monospace;
            font-size:.7rem;font-weight:500;
            color:rgba(255,255,255,.45);
            letter-spacing:.04em;
        }
        .badge::before{
            content:'';width:7px;height:7px;border-radius:50%;
            background:#facc15;box-shadow:0 0 10px #facc15;
            animation:pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
</head>
<body>
    <iframe class="bg-frame" src="https://threeui.com/landing-pages/inner-green-3d.html" allow="autoplay" loading="eager" title="Living Green background"></iframe>

    <div class="overlay">
        <div class="card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
            </div>
            <h1>Scheduled Maintenance</h1>
            <p class="desc">We're deploying upgrades to improve performance. The platform will be back online shortly.</p>
            <div class="progress-wrap">
                <div class="progress-head">
                    <span>Deployment</span>
                    <span id="pct">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="bar"></div>
                </div>
            </div>
            <span class="badge">Maintenance in progress</span>
        </div>
    </div>

    <script>
        const bar=document.getElementById('bar');
        const pct=document.getElementById('pct');
        let p=0,d=1;
        (function tick(){
            requestAnimationFrame(tick);
            p+=d*.0006;
            if(p>=1){p=1;d=-1}
            if(p<=0){p=0;d=1}
            const v=Math.round(p*100);
            pct.textContent=v+'%';
        })();
    </script>
</body>
</html>
