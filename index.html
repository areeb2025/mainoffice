<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0f; font-family: 'Inter', -apple-system, sans-serif; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .content { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .logo { margin-bottom: 2rem; }
        .logo svg { width: 120px; height: 120px; filter: drop-shadow(0 0 30px rgba(0, 180, 255, 0.5)); animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 30px rgba(0, 180, 255, 0.5)); } 50% { filter: drop-shadow(0 0 50px rgba(0, 180, 255, 0.8)); } }
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 800; background: linear-gradient(135deg, #00b4ff 0%, #00ff88 50%, #ffd700 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; letter-spacing: -0.02em; }
        .subtitle { font-size: clamp(1rem, 3vw, 1.5rem); color: #8892a6; font-weight: 400; max-width: 600px; margin-bottom: 3rem; line-height: 1.6; }
        .progress-container { width: 100%; max-width: 400px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-bottom: 2rem; position: relative; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00b4ff, #00ff88); border-radius: 2px; animation: progress 8s ease-in-out infinite; }
        @keyframes progress { 0% { width: 0%; left: 0; } 50% { width: 100%; left: 0; } 100% { width: 0%; left: 100%; } }
        .status { font-size: 0.875rem; color: #5a6478; font-family: 'JetBrains Mono', monospace; }
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #00b4ff; opacity: 0; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100px) scale(1); opacity: 0; } }
        .wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 100px; background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.05), transparent); animation: wave 10s linear infinite; }
        @keyframes wave { 0% { transform: translateX(0) rotate(-5deg); } 100% { transform: translateX(-50%) rotate(-5deg); } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="particles" id="particles"></div>
    <div class="content">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00b4ff"/>
                        <stop offset="100%" style="stop-color:#00ff88"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0">
                    <animate attributeName="stroke-dashoffset" from="282.7" to="0" dur="2s" fill="freeze"/>
                    <animate attributeName="stroke-dasharray" from="0 282.7" to="282.7 0" dur="2s" fill="freeze"/>
                </circle>
                <path d="M30 50 L45 65 L70 35" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
                    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1s" begin="1.5s" fill="freeze"/>
                </path>
            </svg>
        </div>
        <h1>Under Maintenance</h1>
        <p class="subtitle">We're working hard to bring you an improved experience. The site will be back shortly.</p>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="status" id="status">Initializing systems...</div>
        <div class="wave"></div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.minPolarAngle = Math.PI / 3;
        controls.maxPolarAngle = Math.PI / 1.5;

        const particlesCount = 3000;
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);
        const sizes = new Float32Array(particlesCount);
        const velocities = [];

        const color1 = new THREE.Color(0x00b4ff);
        const color2 = new THREE.Color(0x00ff88);
        const color3 = new THREE.Color(0xffd700);

        for (let i = 0; i < particlesCount; i++) {
            const radius = 15 + Math.random() * 20;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = radius * Math.cos(phi);
            const colorMix = Math.random();
            let color;
            if (colorMix < 0.33) color = color1.clone().lerp(color2, Math.random());
            else if (colorMix < 0.66) color = color2.clone().lerp(color3, Math.random());
            else color = color3.clone().lerp(color1, Math.random());
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
            sizes[i] = 0.5 + Math.random() * 1.5;
            velocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02,
                rotX: (Math.random() - 0.5) * 0.001,
                rotY: (Math.random() - 0.5) * 0.001,
                rotZ: (Math.random() - 0.5) * 0.001
            });
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        const ringGeometry = new THREE.RingGeometry(18, 20, 128);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x00b4ff,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);

        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial.clone());
        ring2.rotation.y = Math.PI / 2;
        ring2.material.color.setHex(0x00ff88);
        scene.add(ring2);

        const ring3 = new THREE.Mesh(ringGeometry, ringMaterial.clone());
        ring3.rotation.z = Math.PI / 2;
        ring3.material.color.setHex(0xffd700);
        scene.add(ring3);

        const statusEl = document.getElementById('status');
        const statuses = [
            'Initializing systems...',
            'Checking database connections...',
            'Optimizing performance...',
            'Deploying updates...',
            'Running diagnostics...',
            'Almost ready...'
        ];
        let statusIndex = 0;
        setInterval(() => {
            statusIndex = (statusIndex + 1) % statuses.length;
            statusEl.style.opacity = 0;
            setTimeout(() => {
                statusEl.textContent = statuses[statusIndex];
                statusEl.style.opacity = 1;
            }, 300);
        }, 2000);

        const mouse = { x: 0, y: 0 };
        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const pos = geometry.attributes.position.array;
            for (let i = 0; i < particlesCount; i++) {
                pos[i * 3] += velocities[i].x * Math.sin(time + i);
                pos[i * 3 + 1] += velocities[i].y * Math.cos(time + i);
                pos[i * 3 + 2] += velocities[i].z * Math.sin(time * 0.5 + i);
                const dist = Math.sqrt(pos[i * 3] ** 2 + pos[i * 3 + 1] ** 2 + pos[i * 3 + 2] ** 2);
                if (dist > 40) {
                    const scale = 35 / dist;
                    pos[i * 3] *= scale;
                    pos[i * 3 + 1] *= scale;
                    pos[i * 3 + 2] *= scale;
                }
            }
            geometry.attributes.position.needsUpdate = true;
            particles.rotation.x += 0.0001;
            particles.rotation.y += 0.0002;
            ring1.rotation.z += 0.0005;
            ring2.rotation.x += 0.0003;
            ring3.rotation.y += 0.0004;
            ring1.material.opacity = 0.1 + Math.sin(time) * 0.05;
            ring2.material.opacity = 0.1 + Math.cos(time) * 0.05;
            ring3.material.opacity = 0.1 + Math.sin(time * 1.5) * 0.05;
            camera.position.x += (mouse.x * 5 - camera.position.x) * 0.02;
            camera.position.y += (mouse.y * 5 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 6 + 's';
            p.style.animationDuration = 4 + Math.random() * 4 + 's';
            p.style.background = ['#00b4ff', '#00ff88', '#ffd700'][Math.floor(Math.random() * 3)];
            document.getElementById('particles').appendChild(p);
        }
    </script>
</body>
</html>
