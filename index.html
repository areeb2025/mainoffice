<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mainoffice — Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#05060f;--card:rgba(12,15,30,0.85);--border:#141729;--fg:#e4e6ee;--fg-muted:#5a5f7a;--accent:#00d4aa;--accent-dim:rgba(0,212,170,0.12);--accent-glow:rgba(0,212,170,0.35);--warn:#f59e0b;--error:#ef4444}
        *{margin:0;padding:0;box-sizing:border-box}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
        html{scroll-behavior:smooth}
        body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
        #canvas{position:fixed;inset:0;z-index:0}
        main{position:relative;z-index:10;min-height:100vh;display:grid;place-items:center;padding:clamp(2rem,5vw,4rem) clamp(1.5rem,4vw,3rem)}
        .container{width:100%;max-width:720px}
        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(2.5rem,6vw,4rem)}
        .brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit}
        .brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent) 0%,#6366f1 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
        .brand-mark::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-100%);animation:shimmer 2.5s ease-in-out infinite}
        @keyframes shimmer{to{transform:translateX(100%)}}
        .brand-mark svg{width:22px;height:22px;stroke:var(--bg);z-index:1}
        .brand-text{font-weight:700;font-size:clamp(1.125rem,2.5vw,1.375rem);letter-spacing:-.02em}
        .brand-suffix{color:var(--fg-muted);font-weight:500;font-size:.875rem}
        .status-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);font-family:'JetBrains Mono',monospace;backdrop-filter:blur(12px)}
        .status-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 12px var(--warn);animation:blink 1.5s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
        .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(2rem,5vw,3rem);position:relative;overflow:hidden;backdrop-filter:blur(20px)}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
        .icon-wrapper{width:56px;height:56px;border-radius:14px;background:var(--accent-dim);border:1px solid rgba(0,212,170,.15);display:flex;align-items:center;justify-content:center;margin-bottom:1.75rem}
        .icon-wrapper svg{width:28px;height:28px;stroke:var(--accent)}
        h1{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:1rem;background:linear-gradient(135deg,var(--fg) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .description{color:var(--fg-muted);font-size:clamp(1rem,2vw,1.125rem);line-height:1.7;max-width:520px;margin-bottom:2rem}
        .meta{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;font-family:'JetBrains Mono',monospace;font-size:.8125rem;color:var(--fg-muted)}
        .meta-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:rgba(5,6,15,.6);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(8px)}
        .meta-label{color:var(--accent);font-weight:600}
        .progress-section{margin-bottom:2rem}
        .progress-label{display:flex;justify-content:space-between;margin-bottom:.75rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted)}
        .progress-track{height:6px;background:rgba(5,6,15,.8);border-radius:3px;overflow:hidden;position:relative}
        .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#6366f1,#0088ff);border-radius:3px;position:relative;animation:progress-fill 6s ease-in-out infinite}
        .progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:progress-shine 1.5s ease-in-out infinite}
        @keyframes progress-fill{0%{width:0%;transform-origin:left}50%{width:100%;transform-origin:left}50.01%{transform-origin:right}100%{width:0%;transform-origin:right}}
        @keyframes progress-shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        .details-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:1rem;background:rgba(5,6,15,.6);border:1px solid var(--border);border-radius:10px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:.8125rem;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:1.5rem;backdrop-filter:blur(8px)}
        .details-toggle:hover{border-color:var(--accent);background:var(--accent-dim)}
        .details-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .details-toggle svg{width:18px;height:18px;stroke:var(--fg-muted);transition:transform .2s;flex-shrink:0}
        .details-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
        .details-panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s ease,margin-top .3s ease;margin-top:-1rem}
        .details-panel.open{max-height:400px;opacity:1;margin-top:0}
        .log{background:#050610;border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;line-height:1.8;color:var(--fg-muted);max-height:300px;overflow-y:auto}
        .log-entry{display:flex;gap:.75rem;padding:.25rem 0;border-bottom:1px solid rgba(255,255,255,.03);opacity:0;animation:log-in .3s ease forwards}
        .log-entry:last-child{border-bottom:none}
        @keyframes log-in{to{opacity:1}}
        .log-time{color:var(--accent);white-space:nowrap}
        .log-level{white-space:nowrap;padding:0 .5rem;border-radius:3px;font-weight:500;font-size:.6875rem}
        .log-level.info{background:rgba(0,212,170,.12);color:var(--accent)}
        .log-level.warn{background:rgba(245,158,11,.12);color:var(--warn)}
        .log-msg{color:var(--fg-muted)}
        .actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.875rem 1.5rem;font-family:'Space Grotesk',sans-serif;font-size:.875rem;font-weight:600;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:all .2s ease;text-decoration:none}
        .btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .btn-primary:hover{background:#00e8bb;border-color:#00e8bb;box-shadow:0 4px 24px var(--accent-glow)}
        .btn-secondary{background:rgba(5,6,15,.6);color:var(--fg);border-color:var(--border);backdrop-filter:blur(8px)}
        .btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
        .footer{margin-top:clamp(2.5rem,5vw,3.5rem);text-align:center;color:var(--fg-muted);font-size:.8125rem}
        .footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
        .footer a:hover{border-color:var(--accent)}
        .terminal-hint{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--fg-muted);opacity:.6;transition:opacity .2s;z-index:10;backdrop-filter:blur(12px)}
        .terminal-hint:hover{opacity:1}
        .terminal-hint kbd{background:rgba(5,6,15,.8);border:1px solid var(--border);padding:.125rem .5rem;border-radius:4px;font-size:.6875rem}
        @media(max-width:640px){.header{flex-direction:column;align-items:flex-start;gap:1rem}.terminal-hint{display:none}}
        @media(max-width:480px){.card{padding:1.5rem}.meta{flex-direction:column}.actions{flex-direction:column}.btn{width:100%}}
    </style>
</head>
<body>
    <canvas id="canvas" aria-hidden="true"></canvas>
    <main>
        <div class="container">
            <header class="header">
                <a href="/" class="brand" aria-label="mainoffice home">
                    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 18 2 12 8 6"/></svg></div>
                    <span class="brand-text">mainoffice</span><span class="brand-suffix">.dev</span>
                </a>
                <span class="status-badge" aria-live="polite">Maintenance</span>
            </header>
            <article class="card">
                <div class="icon-wrapper" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
                <h1>Scheduled Maintenance</h1>
                <p class="description">We're deploying infrastructure upgrades to improve reliability and performance. The platform will be back online shortly.</p>

                <div class="progress-section" aria-label="Maintenance progress">
                    <div class="progress-label"><span>Deployment Progress</span><span id="progress-pct" aria-live="polite">0%</span></div>
                    <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Deployment progress">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

            </article>

        </div>
    </main>


    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>
    <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
    camera.position.set(0, 15, 45);

    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x020208, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.08;
    controls.minPolarAngle = Math.PI/4;
    controls.maxPolarAngle = Math.PI/1.4;

    // === STAR FIELD (background) ===
    const starCount = 6000;
    const starPos = new Float32Array(starCount*3);
    const starCol = new Float32Array(starCount*3);
    const starSizes = new Float32Array(starCount);

    for(let i=0;i<starCount;i++){
        const i3=i*3;
        const theta=Math.random()*Math.PI*2;
        const phi=Math.acos(2*Math.random()-1);
        const r=200+Math.random()*800;
        starPos[i3]=r*Math.sin(phi)*Math.cos(theta);
        starPos[i3+1]=r*Math.sin(phi)*Math.sin(theta);
        starPos[i3+2]=r*Math.cos(phi);
        const t=Math.random();
        const c=new THREE.Color();
        if(t<0.3) c.setHSL(0.6,0.2,0.8+Math.random()*0.2);
        else if(t<0.6) c.setHSL(0.55,0.1,0.9+Math.random()*0.1);
        else if(t<0.8) c.setHSL(0.1,0.3,0.7+Math.random()*0.3);
        else c.setHSL(0,0,0.6+Math.random()*0.4);
        starCol[i3]=c.r;starCol[i3+1]=c.g;starCol[i3+2]=c.b;
        starSizes[i]=0.3+Math.random()*1.2;
    }

    const starGeo=new THREE.BufferGeometry();
    starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
    starGeo.setAttribute('color',new THREE.BufferAttribute(starCol,3));
    starGeo.setAttribute('size',new THREE.BufferAttribute(starSizes,1));

    const starMat=new THREE.PointsMaterial({
        size:0.8,vertexColors:true,transparent:true,opacity:0.9,
        sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false
    });
    scene.add(new THREE.Points(starGeo,starMat));

    // === GALAXY DUST BAND (spiral backdrop) ===
    const dustCount=8000;
    const dustPos=new Float32Array(dustCount*3);
    const dustCol=new Float32Array(dustCount*3);

    for(let i=0;i<dustCount;i++){
        const i3=i*3;
        const angle=Math.random()*Math.PI*2;
        const r=80+Math.random()*120;
        const spread=(Math.random()-0.5)*30;
        dustPos[i3]=Math.cos(angle)*r;
        dustPos[i3+1]=spread*(1-r/200);
        dustPos[i3+2]=Math.sin(angle)*r;
        const c=new THREE.Color().setHSL(0.7+Math.random()*0.15,0.5,0.12+Math.random()*0.08);
        dustCol[i3]=c.r;dustCol[i3+1]=c.g;dustCol[i3+2]=c.b;
    }

    const dustGeo=new THREE.BufferGeometry();
    dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
    dustGeo.setAttribute('color',new THREE.BufferAttribute(dustCol,3));
    const dustMat=new THREE.PointsMaterial({
        size:1.5,vertexColors:true,transparent:true,opacity:0.2,
        sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false
    });
    const dustBand=new THREE.Points(dustGeo,dustMat);
    dustBand.rotation.x=0.3;
    scene.add(dustBand);

    // === MAIN PLANET ===
    function createPlanet(radius, color, emissive, atmosphereColor, atmosphereScale){
        const group=new THREE.Group();

        const geo=new THREE.SphereGeometry(radius,64,64);
        const mat=new THREE.MeshStandardMaterial({
            color:color,
            emissive:emissive,
            emissiveIntensity:0.15,
            roughness:0.7,
            metalness:0.1,
        });
        const mesh=new THREE.Mesh(geo,mat);
        group.add(mesh);

        if(atmosphereColor){
            const atmoGeo=new THREE.SphereGeometry(radius*atmosphereScale,64,64);
            const atmoMat=new THREE.ShaderMaterial({
                vertexShader:`
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    void main(){
                        vNormal=normalize(normalMatrix*normal);
                        vPosition=(modelViewMatrix*vec4(position,1.0)).xyz;
                        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
                    }`,
                fragmentShader:`
                    uniform vec3 uColor;
                    uniform float uIntensity;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    void main(){
                        vec3 viewDir=normalize(-vPosition);
                        float rim=1.0-max(dot(viewDir,vNormal),0.0);
                        rim=pow(rim,3.0)*uIntensity;
                        gl_FragColor=vec4(uColor,rim);
                    }`,
                uniforms:{
                    uColor:{value:new THREE.Color(atmosphereColor)},
                    uIntensity:{value:1.5}
                },
                transparent:true,
                side:THREE.BackSide,
                blending:THREE.AdditiveBlending,
                depthWrite:false
            });
            const atmo=new THREE.Mesh(atmoGeo,atmoMat);
            group.add(atmo);
        }

        return group;
    }

    // Earth-like planet
    const earth=createPlanet(6, 0x2255aa, 0x113366, 0x4488ff, 1.08);
    earth.position.set(-8, -2, 0);
    scene.add(earth);

    // Ice/ring planet
    const icePlanet=createPlanet(3.5, 0x8899bb, 0x445566, 0xaabbdd, 1.06);
    icePlanet.position.set(18, 5, -10);
    scene.add(icePlanet);

    // Saturn-like rings
    const ringOuterGeo=new THREE.RingGeometry(5, 8, 128);
    const ringOuterMat=new THREE.MeshBasicMaterial({
        color:0xbbaa88, side:THREE.DoubleSide, transparent:true, opacity:0.35,
        blending:THREE.NormalBlending, depthWrite:false
    });
    const ringOuter=new THREE.Mesh(ringOuterGeo,ringOuterMat);
    ringOuter.position.copy(icePlanet.position);
    ringOuter.rotation.x=Math.PI/2.2;
    ringOuter.rotation.z=0.15;
    scene.add(ringOuter);

    const ringInnerGeo=new THREE.RingGeometry(4.2, 5.5, 128);
    const ringInnerMat=new THREE.MeshBasicMaterial({
        color:0xccbb99, side:THREE.DoubleSide, transparent:true, opacity:0.2,
        blending:THREE.NormalBlending, depthWrite:false
    });
    const ringInner=new THREE.Mesh(ringInnerGeo,ringInnerMat);
    ringInner.position.copy(icePlanet.position);
    ringInner.rotation.x=Math.PI/2.2;
    ringInner.rotation.z=0.15;
    scene.add(ringInner);

    // Mars-like planet (far)
    const mars=createPlanet(2.5, 0xaa4422, 0x662211, 0xdd6633, 1.05);
    mars.position.set(-25, 8, -20);
    scene.add(mars);

    // Gas giant (background)
    const gasGiant=createPlanet(12, 0x995533, 0x553322, 0xaa7744, 1.04);
    gasGiant.position.set(30, -10, -50);
    scene.add(gasGiant);

    // === ASTEROID BELT ===
    const asteroidCount=400;
    const asteroidPositions=new Float32Array(asteroidCount*3);

    for(let i=0;i<asteroidCount;i++){
        const i3=i*3;
        const angle=Math.random()*Math.PI*2;
        const r=14+Math.random()*3;
        asteroidPositions[i3]=Math.cos(angle)*r;
        asteroidPositions[i3+1]=(Math.random()-0.5)*2;
        asteroidPositions[i3+2]=Math.sin(angle)*r;
    }
    const asteroidGeo=new THREE.BufferGeometry();
    asteroidGeo.setAttribute('position',new THREE.BufferAttribute(asteroidPositions,3));
    const asteroidMat=new THREE.PointsMaterial({
        color:0x888888,size:0.25,transparent:true,opacity:0.5,
        sizeAttenuation:true,blending:THREE.NormalBlending,depthWrite:false
    });
    const asteroids=new THREE.Points(asteroidGeo,asteroidMat);
    asteroids.rotation.x=0.2;
    scene.add(asteroids);

    // === LIGHTS ===
    const sunLight=new THREE.DirectionalLight(0xffeedd,2);
    sunLight.position.set(30,20,10);
    scene.add(sunLight);

    const ambient=new THREE.AmbientLight(0x334466,0.4);
    scene.add(ambient);

    const rimLight=new THREE.DirectionalLight(0x4466aa,0.8);
    rimLight.position.set(-20,-10,-20);
    scene.add(rimLight);

    const pointLight=new THREE.PointLight(0xff8844,1,50);
    pointLight.position.set(30,-10,-50);
    scene.add(pointLight);

    // === NEBULA SPRITES ===
    const nebulaCanvas=document.createElement('canvas');
    nebulaCanvas.width=256;nebulaCanvas.height=256;
    const nCtx=nebulaCanvas.getContext('2d');
    const grad=nCtx.createRadialGradient(128,128,0,128,128,128);
    grad.addColorStop(0,'rgba(80,100,200,0.4)');
    grad.addColorStop(0.4,'rgba(60,80,180,0.15)');
    grad.addColorStop(1,'rgba(20,30,80,0)');
    nCtx.fillStyle=grad;
    nCtx.fillRect(0,0,256,256);
    const nebulaTex=new THREE.CanvasTexture(nebulaCanvas);

    for(let i=0;i<5;i++){
        const spriteMat=new THREE.SpriteMaterial({
            map:nebulaTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
            opacity:0.08+Math.random()*0.06
        });
        const sprite=new THREE.Sprite(spriteMat);
        const angle=Math.random()*Math.PI*2;
        const dist=60+Math.random()*80;
        sprite.position.set(Math.cos(angle)*dist,(Math.random()-0.5)*40,Math.sin(angle)*dist);
        sprite.scale.set(80+Math.random()*60,80+Math.random()*60,1);
        scene.add(sprite);
    }

    // === LOGIC ===
    const progressFill=document.getElementById('progress-fill');
    const progressPct=document.getElementById('progress-pct');
    const startedEl=document.getElementById('started-time');
    const etaEl=document.getElementById('eta-time');
    const logEl=document.getElementById('log');
    const toggleBtn=document.getElementById('details-toggle');
    const panel=document.getElementById('details-panel');
    const notifyBtn=document.getElementById('notify-btn');

    const startTime=Date.now();
    startedEl.textContent=new Date(startTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    etaEl.textContent=new Date(startTime+15*60*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

    const logs=[
        {t:0,lvl:'info',msg:'Initializing maintenance window'},
        {t:1200,lvl:'info',msg:'Draining active connections...'},
        {t:2800,lvl:'info',msg:'Connection pool drained (0/247)'},
        {t:4100,lvl:'info',msg:'Starting database migration v2.4.0'},
        {t:6800,lvl:'info',msg:'Migration 1/12: add_index_activation_keys'},
        {t:8200,lvl:'info',msg:'Migration 2/12: alter_email_verification'},
        {t:9500,lvl:'info',msg:'Migration 3/12: create_audit_table'},
        {t:11200,lvl:'info',msg:'Migration 4/12: optimize_queries'},
        {t:13000,lvl:'warn',msg:'Slow query detected on activations table'},
        {t:13200,lvl:'info',msg:'Applied partial index optimization'},
        {t:14800,lvl:'info',msg:'Migration 5/12: update_brand_config'},
        {t:16100,lvl:'info',msg:'Migration 6/12: add_rate_limiting'},
        {t:17500,lvl:'info',msg:'Migration 7/12: refresh_materialized_views'},
        {t:19000,lvl:'info',msg:'Migration 8/12: update_ssl_certs'},
        {t:20500,lvl:'info',msg:'Migration 9/12: cleanup_expired_tokens'},
        {t:22000,lvl:'info',msg:'Migration 10/12: rebuild_search_index'},
        {t:23800,lvl:'info',msg:'Migration 11/12: validate_foreign_keys'},
        {t:25200,lvl:'info',msg:'Migration 12/12: update_schema_version'},
        {t:27000,lvl:'info',msg:'All migrations applied successfully'},
        {t:28500,lvl:'info',msg:'Running health checks...'},
        {t:29800,lvl:'info',msg:'API: OK | DB: OK | Cache: OK | Queue: OK'},
        {t:31000,lvl:'info',msg:'Warming cache layers...'},
        {t:32500,lvl:'info',msg:'Rolling out to edge nodes...'},
        {t:34200,lvl:'info',msg:'Verifying deployment integrity'},
        {t:35800,lvl:'info',msg:'Maintenance window completing'},
        {t:37000,lvl:'info',msg:'Restoring traffic...'}
    ];

    function renderLogs(elapsed){
        logEl.innerHTML='';
        logs.filter(l=>l.t<=elapsed).forEach((l,i)=>{
            const entry=document.createElement('div');
            entry.className='log-entry';
            entry.style.animationDelay=(i*30)+'ms';
            const time=new Date(startTime+l.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
            entry.innerHTML=`<span class="log-time">[${time}]</span><span class="log-level ${l.lvl}">${l.lvl.toUpperCase()}</span><span class="log-msg">${l.msg}</span>`;
            logEl.appendChild(entry);
        });
        logEl.scrollTop=logEl.scrollHeight;
    }

    let progress=0,direction=1;

    function animate(){
        requestAnimationFrame(animate);
        const t=Date.now()*0.001;
        const elapsed=Date.now()-startTime;

        // Rotate planets
        earth.children[0].rotation.y+=0.003;
        earth.children[1].rotation.y+=0.003;
        icePlanet.children[0].rotation.y+=0.005;
        if(icePlanet.children[1]) icePlanet.children[1].rotation.y+=0.005;
        mars.children[0].rotation.y+=0.004;
        mars.children[1].rotation.y+=0.004;
        gasGiant.children[0].rotation.y+=0.001;
        if(gasGiant.children[1]) gasGiant.children[1].rotation.y+=0.001;

        // Ring subtle wobble
        ringOuter.rotation.z=0.15+Math.sin(t*0.2)*0.02;
        ringInner.rotation.z=0.15+Math.sin(t*0.2)*0.02;

        // Asteroids orbit
        asteroids.rotation.y+=0.0003;

        // Dust band slow rotation
        dustBand.rotation.y+=0.00008;

        // Progress
        progress+=direction*0.0008;
        if(progress>=1){progress=1;direction=-1}
        if(progress<=0){progress=0;direction=1}
        const pct=Math.round(progress*100);
        progressFill.style.width=pct+'%';
        progressFill.parentElement.setAttribute('aria-valuenow',pct);
        progressPct.textContent=pct+'%';

        if(elapsed<logs[logs.length-1].t) renderLogs(elapsed);

        controls.update();
        renderer.render(scene,camera);
    }

    animate();

    toggleBtn.addEventListener('click',()=>{
        const expanded=toggleBtn.getAttribute('aria-expanded')==='true';
        toggleBtn.setAttribute('aria-expanded',!expanded);
        panel.classList.toggle('open');
    });

    notifyBtn.addEventListener('click',()=>{
        notifyBtn.textContent='Subscribed';
        notifyBtn.disabled=true;
        notifyBtn.style.opacity='.6';
    });

    window.addEventListener('resize',()=>{
        camera.aspect=innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth,innerHeight);
    });

    document.addEventListener('keydown',(e)=>{
        if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();alert('Command palette: Deploy, Logs, Metrics, Settings')}
    });
    </script>
</body>
</html>
